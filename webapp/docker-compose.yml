services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shorts
      POSTGRES_USER: shorts
      POSTGRES_PASSWORD: shorts
    # Host port 5432 + 5433 are taken by the machine's own Postgres services
    # (postgresql-x64-16 on 5432, postgresql-x64-14 on 5433). Map the container's
    # Postgres to host 5434 so `docker compose up` works without stopping system
    # services. DATABASE_URL points at localhost:5434 (see .env.example).
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorts"]
      interval: 2s
      retries: 20

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI

  # OPTIONAL — enable only when a phase needs real S3 presigned URLs.
  # Default storage is local disk (webapp/.storage served at /media/<key>).
  minio:
    profiles: [minio]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shorts
      MINIO_ROOT_PASSWORD: shortsdev
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata: {}
